<section class="background-section">
</section> <!-- Hero Section -->

<div class="login-page">
    <div class="card login-card">
        <a href="/"><img src="assets/logo.jpg" class="home-logo"></a>

        <h2>Mot de passe oublié</h2>
        <p>Entrez votre adresse e-mail et nous vous enverrons un lien pour réinitialiser votre mot de passe.</p>
        <form id="request-form">
            <div class="form-group">
                <label for="email">Adresse e-mail</label>
                <input type="email" id="email" name="email" placeholder="votre.email@example.com" required>
            </div>
            <button id="request-button" type="submit" class="btn-primary w-100">Envoyer le lien</button>
        </form>
        <div id="request-message" class="form-status">
            Entrez votre adresse e-mail pour recevoir un lien de réinitialisation.
        </div>
        <div class="text-center">
            <a href="/login">Retour à la connexion</a>
        </div>
    </div>
</div>
