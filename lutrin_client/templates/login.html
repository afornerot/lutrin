<div class="min-h-screen flex items-center justify-center">
    <div class="max-w-md w-full bg-white p-8 rounded-lg shadow-md">
        <img src="assets/logo.jpg" class="m-auto w-32">
        <h2 class="text-2xl font-bold text-center text-gray-800 mb-6">Connexion - Lutrin</h2>
        <form id="login-form">
            <div class="mb-4">
                <label for="username" class="block text-gray-700 text-sm font-bold mb-2">Nom d'utilisateur</label>
                <input type="text" id="username" name="username" required
                    class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight">
            </div>
            <div class="mb-6">
                <label for="password" class="block text-gray-700 text-sm font-bold mb-2">Mot de passe</label>
                <input type="password" id="password" name="password" required
                    class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 mb-3 leading-tight">
            </div>
            <div class="mb-6">
                <label class="inline-flex items-center">
                    <input type="checkbox" id="remember-me" class="form-checkbox h-5 w-5 text-blue-600">
                    <span class="ml-2 text-gray-700 text-sm">Rester connecté</span>
                </label>
            </div>
            <button type="submit" id="login-button"
                class="w-full bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">
                Se connecter
            </button>
            <p id="login-error" class="text-red-500 text-xs italic mt-4 text-center hidden"></p>
        </form>

        <div class="text-center mt-4">
            <a href="/passwordrequest"
                class="inline-block align-baseline font-bold text-sm text-blue-500 hover:text-blue-800">
                Mot de passe oublié ?
            </a>
        </div>

        <div class="mt-6 text-center">
            <a href="/registerrequest"
                class="inline-block align-baseline font-bold text-sm text-blue-500 hover:text-blue-800">
                Pas encore de compte ? S'inscrire
            </a>
        </div>
    </div>
</div>
