<div class="login-page">
    <div class="card login-card">
        <a href="/"><img src="assets/logo.jpg" class="home-logo"></a>
        <h2>Connexion - Lutrin</h2>
        <form id="login-form">
            <div class="form-group">
                <label for="username">Nom d'utilisateur</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="form-group">
                <label for="password">Mot de passe</label>
                <input type="password" id="password" name="password" required>
            </div>
            <div class="form-group">
                <label class="checkbox-label">
                    <input type="checkbox" id="remember-me">
                    Rester connecté
                </label>
            </div>
            <button type="submit" id="login-button" class="btn-primary w-100">Se connecter</button>
            <p id="login-error" class="error hidden"></p>
        </form>

        <div class="text-center">
            <a href="/passwordrequest">Mot de passe oublié ?</a>
        </div>

        <div class="text-center">
            <a href="/registerrequest">Pas encore de compte ? S'inscrire</a>
        </div>
    </div>
</div>
