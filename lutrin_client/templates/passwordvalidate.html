<div class="login-page">
    <div class="card login-card">
        <h2>Réinitialiser le mot de passe</h2>
        <form id="validate-form">
            <input type="hidden" id="token" name="token" value="">
            <div class="form-group">
                <label for="password">Nouveau mot de passe</label>
                <input type="password" id="password" name="password" placeholder="Au moins 8 caractères, 1 chiffre et 1 caractère spécial" required>
            </div>
            <div class="form-group">
                <label for="password_confirmation">Confirmation du mot de passe</label>
                <input type="password" id="password_confirmation" name="password_confirmation" placeholder="Confirmez votre mot de passe" required>
            </div>
            <button id="validate-button" type="submit" class="btn-primary">Réinitialiser le mot de passe</button>
        </form>
        <div id="validate-message" class="text-center"></div>
    </div>
</div>
