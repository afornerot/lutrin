<!-- templates/console.html -->
<div class="page-content">
    <h1>Console</h1>

    <!-- Zone de Statut/Chargement -->
    <div id="status-message" class="status-loading hidden">
        <div class="flex items-center">
            <div class="loader"></div>
            <span>Opération en cours...</span>
        </div>
    </div>

    <!-- Zone Erreur -->
    <p id="error-message" class="error hidden">Une erreur est survenue.</p>

    <!-- Zone de Lecture Audio -->
    <div class="card mb-4">
        <h2>
            <i class="fas fa-headphones"></i>
            Synthèse Vocale
        </h2>

        <div class="form-group">
            <label>Lecture Audio = /tts</label>
            <audio id="audio-playback" style="width: 100%;" controls></audio>
        </div>
    </div>

    <main class="grid grid-3col gap-4">
        <div>
            <!-- Zone de Streaming -->
            <div class="card">
                <h2>
                    <i class="fas fa-video"></i>
                    Vision en Direct
                </h2>

                <div class="form-group">
                    <label>Flux Vidéo = /video</label>
                    <video id="video-stream" autoplay playsinline></video>
                    <img src="http://localhost:8080/stream.mjpeg" alt="Flux vidéo en direct.">
                </div>

                <button id="capture-button" class="btn-primary w-100">
                    <i class="fas fa-camera"></i>
                    Capturer la vidéo
                </button>
            </div>

            <!-- Zone de Photos Test -->
            <div class="card mt-4">
                <h2>
                    <i class="fas fa-video"></i>
                    Photos de test
                </h2>

                <label>Fichier = /file</label>

                <button id="capture-photo01" data-file="test01.jpg" class="btn-primary w-100 mb-1">
                    <i class="fas fa-camera"></i>
                    Capturer l'image de test 01
                </button>
                <button id="capture-photo02" data-file="test02.jpg" class="btn-primary w-100 mb-1">
                    <i class="fas fa-camera"></i>
                    Capturer l'image de test 02
                </button>
                <button id="capture-photo03" data-file="test03.jpg" class="btn-primary w-100 mb-1">
                    <i class="fas fa-camera"></i>
                    Capturer l'image de test 03
                </button>
                <button id="capture-photo04" data-file="test04.jpg" class="btn-primary w-100 mb-1">
                    <i class="fas fa-camera"></i>
                    Capturer l'image de test 04
                </button>
            </div>
        </div>

        <div>
            <!-- Image Capturée -->
            <div class="card mb-4">
                <h2>
                    <i class="fas fa-image"></i>
                    Capture
                </h2>

                <div class="form-group">
                    <label>Image Capturée = /capture</label>
                    <img id="captured-image" src="" alt="Dernière image capturée" class="w-100">
                </div>
            </div>

            <!-- Zone de Statistiques -->
            <div class="card">
                <h2>
                    <i class="fas fa-chart-bar"></i>
                    Statistiques de Traitement
                </h2>
                <div class="stats">
                    <p><strong>Capture:</strong> <span id="stat-capture-time">N/A</span> s</p>
                    <p><strong>OCR:</strong> <span id="stat-ocr-time">N/A</span> s</p>
                    <p><strong>TTS:</strong> <span id="stat-tts-time">N/A</span> s</p>
                </div>
            </div>
        </div>

        <!-- Zone OCR -->
        <div class="card" style="display: flex; flex-direction: column;">
            <h2>
                <i class="fas fa-spell-check"></i>
                Résultats OCR
            </h2>

            <div class="form-group" style="flex-grow: 1; display: flex; flex-direction: column;">
                <label>Texte Reconnu = /ocr</label>
                <textarea id="ocr-text-result" placeholder="Le texte reconnu apparaîtra ici..."
                    style="flex-grow: 1;"></textarea>
            </div>

            <button id="capture-textarea-button" class="btn-primary w-100 mb-1">
                <i class="fas fa-keyboard"></i>
                Capturer le texte saisi
            </button>
            <button id="capture-text01" data-file="test01.txt" class="btn-secondary w-100 mb-1">
                <i class="fas fa-camera"></i>
                Capturer le texte de test 01
            </button>
        </div>
    </main>
</div>
