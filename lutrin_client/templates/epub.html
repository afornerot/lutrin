<!-- /templates/epub.html -->
<div id="epub-detail-container">

    <!-- Barre supérieure fixe -->
    <div id="epub-top-bar" class="hidden"></div>

    <!-- Indicateur de chargement -->
    <div id="epub-loading" class="loading-state">
        <div class="loader"></div>
        <p>Chargement du livre...</p>
    </div>

    <!-- Contenu du livre (initialement caché) -->
    <div id="epub-content" class="hidden epub-layout">
        <!-- Colonne de gauche : Couverture et informations -->
        <div id="epub-left-panel">
            <div id="epub-cover">
                <!-- La couverture sera injectée ici -->
            </div>
            <div id="epub-info">
                <!-- Les informations du livre seront injectées ici -->
            </div>
        </div>

        <!-- Colonne de droite : Texte du livre -->
        <div id="epub-text-panel"></div>
    </div>

    <!-- Conteneur pour les erreurs -->
    <div id="epub-error-container"></div>

    <!-- Overlay pour modifier le style -->
    <div id="edit-style-overlay" class="modal-overlay hidden">
        <div class="modal-card">
            <h3>Modifier le genre</h3>
            <div class="form-group">
                <label for="edit-style-input">Genre</label>
                <input type="text" id="edit-style-input">
            </div>
            <div class="modal-actions">
                <button type="button" id="cancel-edit-style" class="btn-secondary">Annuler</button>
                <button type="button" id="save-edit-style" class="btn-primary">Sauvegarder</button>
            </div>
        </div>
    </div>

    <!-- Overlay pour modifier la série -->
    <div id="edit-series-overlay" class="modal-overlay hidden">
        <div class="modal-card">
            <h3>Modifier la série</h3>
            <div class="form-group">
                <label for="edit-series-name-input">Nom de la série</label>
                <input type="text" id="edit-series-name-input">
            </div>
            <div class="form-group">
                <label for="edit-series-number-input">Numéro dans la série</label>
                <input type="number" id="edit-series-number-input">
            </div>
            <div class="modal-actions">
                <button type="button" id="cancel-edit-series" class="btn-secondary">Annuler</button>
                <button type="button" id="save-edit-series" class="btn-primary">Sauvegarder</button>
            </div>
        </div>
    </div>

    <!-- Overlay pour modifier l'auteur -->
    <div id="edit-authors-overlay" class="modal-overlay hidden">
        <div class="modal-card">
            <h3>Modifier le ou les auteurs</h3>
            <div class="form-group">
                <label for="edit-authors-input">Auteurs (séparés par une virgule)</label>
                <input type="text" id="edit-authors-input" placeholder="Auteur 1, Auteur 2, ...">
            </div>
            <div class="modal-actions">
                <button type="button" id="cancel-edit-authors" class="btn-secondary">Annuler</button>
                <button type="button" id="save-edit-authors" class="btn-primary">Sauvegarder</button>
            </div>
        </div>
    </div>

    <!-- Barre de lecture audio fixe en bas -->
    <div id="epub-audio-player-bar" class="hidden">
        <div class="chapter-slider-area">
            <input type="range" id="epub-chapter-slider">
            <div id="epub-chapter-display">Chapitre 1 / 1</div>
        </div>

        <div class="audio-controls">
            <button id="epub-prev-10-chapter-button">
                <i class="fas fa-fast-backward"></i>
            </button>
            <button id="epub-prev-chapter-button">
                <i class="fas fa-step-backward"></i>
            </button>

            <button id="epub-play-audio-button">
                <i class="fas fa-play"></i>
                <span>Écouter</span>
            </button>

            <button id="epub-next-chapter-button">
                <i class="fas fa-step-forward"></i>
            </button>
            <button id="epub-next-10-chapter-button">
                <i class="fas fa-fast-forward"></i>
            </button>
        </div>
        <!-- Le lecteur audio est maintenant visible -->
        <audio id="epub-audio-player" controls></audio>
    </div>
</div>
