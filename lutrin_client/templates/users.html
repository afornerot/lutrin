<!-- /templates/users.html -->
<div class="page-content">
    <h1>Gestion des Utilisateurs</h1>

    <div class="action-bar">
        <button id="add-user-button" class="btn-primary">
            <i class="fas fa-user-plus"></i>
            <span>Ajouter un utilisateur</span>
        </button>
    </div>

    <!-- Message de statut/erreur -->
    <div id="user-management-message" class="status-message hidden"></div>

    <div class="card">
        <table>
            <thead>
                <tr>
                    <th>Actions</th>
                    <th>ID</th>
                    <th>Nom d'utilisateur</th>
                    <th>Email</th>
                    <th>Rôle</th>
                </tr>
            </thead>
            <tbody id="users-table-body">
                <!-- Les utilisateurs seront insérés ici par JavaScript -->
            </tbody>
        </table>
        <p id="users-placeholder" class="hidden placeholder">Aucun utilisateur trouvé.</p>
    </div>
</div>

<!-- Modale d'ajout/édition d'utilisateur -->
<div id="user-modal-overlay" class="modal-overlay hidden">
    <div class="modal-card">
        <h3 id="user-modal-title">Ajouter un utilisateur</h3>
        <form id="user-form">
            <input type="hidden" id="user-id-field">
            <div class="form-group">
                <label for="username-field">Nom d'utilisateur</label>
                <input type="text" id="username-field" name="username" required>
            </div>
            <div class="form-group">
                <label for="email-field">Email</label>
                <input type="email" id="email-field" name="email" required>
            </div>
            <div class="form-group">
                <label for="password-field">Mot de passe</label>
                <input type="password" id="password-field" name="password" placeholder="Laisser vide pour ne pas changer">
            </div>
            <div class="form-group">
                <label for="role-field">Rôle</label>
                <select id="role-field" name="role">
                    <option value="USER">Utilisateur</option>
                    <option value="ADMIN">Administrateur</option>
                </select>
            </div>
            <div class="modal-actions">
                <button type="button" id="cancel-user-modal" class="btn-secondary">Annuler</button>
                <button type="submit" id="save-user-button" class="btn-primary">Sauvegarder</button>
            </div>
        </form>
    </div>
</div>

<!-- Modale de confirmation de suppression -->
<div id="delete-user-modal-overlay" class="modal-overlay hidden">
    <div class="modal-card">
        <h3>Confirmer la suppression</h3>
        <p>Êtes-vous sûr de vouloir supprimer l'utilisateur <strong id="delete-username-display"></strong> (ID: <strong id="delete-userid-display"></strong>) ? Cette action est irréversible.</p>
        <div class="modal-actions">
            <button type="button" id="cancel-delete-user" class="btn-secondary">Annuler</button>
            <button type="button" id="confirm-delete-user" class="btn-danger">Supprimer</button>
        </div>
    </div>
</div>
