<!-- templates/camera.html -->
<div id="camera-mode-content" class="camera-view">

    <!-- Zone de Statut/Chargement pour le mode caméra -->
    <div id="camera-status-overlay" class="modal-overlay hidden">
        <div id="camera-status-message" class="camera-status">
            <div class="loader"></div>
            <span id="camera-status-text">Opération en cours...</span>
        </div>

        <!-- Zone Erreur pour le mode caméra -->
        <div id="camera-error-message" class="camera-error hidden">
            <span id="camera-error-text">Une erreur est survenue.</span>
        </div>
    </div>

    <!-- La vidéo prendra l'espace disponible -->
    <div class="camera-stream-area">
        <!-- Conteneur pour le flux vidéo ou l'image streamée -->
        <div id="camera-stream-container">
            <!-- La balise <video> ou <img> sera injectée ici par le JS -->
        </div>

        <!-- Conteneur pour le résultat OCR (initialement caché) -->
        <div id="camera-ocr-result-container" class="hidden">
            <div class="ocr-header">
                <h3>Texte reconnu</h3>
            </div>
            <div id="camera-ocr-text-result"></div>
        </div>

        <!-- Bouton pour changer de caméra -->
        <button id="switch-camera-button" title="Changer de caméra">
            <i class="fas fa-sync-alt"></i>
        </button>
    </div>

    <!-- Le bouton et le lecteur audio restent en bas -->
    <div class="camera-controls">
        <div class="camera-buttons">
            <button id="camera-mode-action-button" class="btn-primary">
                <i class="fas fa-book-open"></i>
                Lire la page
            </button>
            <button id="camera-mode-stop-button" class="btn-danger hidden">
                <i class="fas fa-stop"></i>
            </button>
        </div>
        <audio id="camera-audio-playback" controls></audio>
    </div>
</div>
