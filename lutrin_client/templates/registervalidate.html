<div class="min-h-screen flex items-center justify-center">
    <div class="max-w-md w-full bg-white p-8 rounded-lg shadow-md">
        <h2 class="text-2xl font-bold text-center text-gray-800 mb-6">Choisissez votre mot de passe</h2>
        <form id="validate-form">
            <!-- Champ caché pour stocker le token -->
            <input type="hidden" id="token" name="token" value="">

            <div class="mb-4">
                <label for="password" class="block text-gray-700 text-sm font-bold mb-2">Mot de passe</label>
                <input type="password" id="password" name="password"
                    class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                    placeholder="Au moins 8 caractères, 1 chiffre et 1 caractère spécial" required>
            </div>
            <div class="mb-6">
                <label for="password_confirmation" class="block text-gray-700 text-sm font-bold mb-2">Confirmation du
                    mot de passe</label>
                <input type="password" id="password_confirmation" name="password_confirmation"
                    class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                    placeholder="Confirmez votre mot de passe" required>
            </div>
            <div class="flex items-center justify-center">
                <button id="validate-button" type="submit"
                    class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline w-full flex items-center justify-center">
                    <i id="validate-icon" class="fas fa-key mr-2"></i>
                    <span id="validate-text">Valider et créer mon compte</span>
                </button>
            </div>
        </form>
        <div id="validate-message" class="mt-4 text-center text-sm"></div>
    </div>
</div>
