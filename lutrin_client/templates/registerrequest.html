<div class="login-page">
    <div class="card login-card">
        <a href="/"><img src="assets/logo.jpg" class="home-logo"></a>

        <h2>Créer un compte</h2>
        <form id="request-form">
            <div class="form-group">
                <label for="username">Nom d'utilisateur</label>
                <input type="text" id="username" name="username" placeholder="Choisissez un nom d'utilisateur" required>
            </div>
            <div class="form-group">
                <label for="email">Adresse e-mail</label>
                <input type="email" id="email" name="email" placeholder="votre.email@example.com" required>
            </div>
            <button id="request-button" type="submit" class="btn-primary w-100">
                <i id="request-icon" class="fas fa-user-plus"></i>
                <span id="request-text">Recevoir le lien d'inscription</span>
            </button>
        </form>
        <div id="request-message" class="form-status">
            Entrez vos informations pour recevoir un lien d'inscription par e-mail.
        </div>
        <div class="text-center">
            <a href="/login">Déjà un compte ? Se connecter</a>
        </div>
    </div>
</div>
