<div class="min-h-screen flex items-center justify-center">
    <div class="max-w-md w-full bg-white p-8 rounded-lg shadow-md">
        <h2 class="text-2xl font-bold text-center text-gray-800 mb-6">Créer un compte</h2>
        <form id="request-form">
            <div class="mb-4">
                <label for="username" class="block text-gray-700 text-sm font-bold mb-2">Nom d'utilisateur</label>
                <input type="text" id="username" name="username"
                    class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                    placeholder="Choisissez un nom d'utilisateur" required>
            </div>
            <div class="mb-6">
                <label for="email" class="block text-gray-700 text-sm font-bold mb-2">Adresse e-mail</label>
                <input type="email" id="email" name="email"
                    class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                    placeholder="votre.email@example.com" required>
            </div>
            <div class="flex items-center justify-center">
                <button id="request-button" type="submit"
                    class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline w-full flex items-center justify-center">
                    <i id="request-icon" class="fas fa-user-plus mr-2"></i>
                    <span id="request-text">Recevoir le lien d'inscription</span>
                </button>
            </div>
        </form>
        <div id="request-message" class="mt-4 text-center text-sm"></div>
        <div class="mt-6 text-center">
            <a href="#/login" class="inline-block align-baseline font-bold text-sm text-blue-500 hover:text-blue-800">
                Déjà un compte ? Se connecter
            </a>
        </div>
    </div>
</div>
