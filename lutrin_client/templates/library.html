<!-- /templates/library.html -->
<div class="page-content">
    <!-- Modale de statut -->
    <div id="library-status-overlay" class="modal-overlay hidden">
        <div class="card modal-loading">
            <div class="loader"></div>
            <span id="library-status-text">Traitement en cours...</span>
        </div>
    </div>

    <h1>Bibliothèque Lutrin</h1>

    <div class="action-bar">
        <button id="admin-add-epub-button" class="btn-danger hidden" data-admin-only="true">
            <i class="fas fa-upload"></i>
            <span>Ajouter un livre</span>
        </button>
    </div>

    <input type="file" id="admin-epub-file-input" class="hidden" accept=".epub">

    <!-- Barre de filtres -->
    <div id="filters-bar" class="card filters-bar">
        <div class="form-group">
            <label for="title-filter">Rechercher par titre</label>
            <input type="text" id="title-filter" placeholder="Titre du livre...">
        </div>
        <div class="form-group">
            <label for="style-filter">Genre</label>
            <select id="style-filter"></select>
        </div>
        <div class="form-group">
            <label for="series-filter">Série</label>
            <select id="series-filter"></select>
        </div>
        <div class="form-group">
            <label for="author-filter">Auteur</label>
            <select id="author-filter"></select>
        </div>
        <div class="toggle-group">
            <label class="checkbox-label">
                <input type="checkbox" id="hide-downloaded-toggle">
                Masquer les déjà téléchargés
            </label>
        </div>
    </div>

    <div id="library-list-container">
        <div id="library-list"></div>

        <div id="library-placeholder" class="hidden placeholder">
            <i class="fas fa-book-dead"></i>
            <p>La bibliothèque centrale est vide ou inaccessible.</p>
        </div>
    </div>
</div>

<!-- Modale d'édition pour la bibliothèque centrale (Admin) -->
<div id="library-edit-overlay" class="modal-overlay hidden">
    <div class="modal-card">
        <h3>Modifier le livre</h3>
        <div class="modal-grid">
            <!-- Colonne de gauche : Couverture -->
            <div>
                <label>Couverture</label>
                <div id="edit-cover-preview-wrapper" class="cover-preview">
                    <img id="edit-cover-preview" src="" alt="Aperçu de la couverture">
                    <div class="cover-overlay">
                        <span>Cliquer pour changer la couverture</span>
                    </div>
                </div>
                <input type="file" id="edit-cover-input" class="hidden" accept="image/png, image/jpeg, image/webp">
            </div>
            <!-- Colonne de droite : Champs de texte -->
            <div class="form-group">
                <div class="form-group">
                    <label for="edit-authors-input">Auteurs (séparés par une virgule)</label>
                    <input type="text" id="edit-authors-input">
                </div>
                <div class="form-group">
                    <label for="edit-style-input">Genre</label>
                    <input type="text" id="edit-style-input">
                </div>
                <div class="form-group">
                    <label for="edit-series-name-input">Série</label>
                    <input type="text" id="edit-series-name-input">
                </div>
                <div class="form-group">
                    <label for="edit-series-number-input">Numéro de série</label>
                    <input type="number" id="edit-series-number-input">
                </div>
                <div class="form-group">
                    <label for="edit-description-input">Description</label>
                    <textarea id="edit-description-input" rows="4"></textarea>
                </div>
            </div>
        </div>
        <div class="modal-actions">
            <button type="button" id="cancel-library-edit" class="btn-secondary">Annuler</button>
            <button type="button" id="save-library-edit" class="btn-primary">Sauvegarder</button>
        </div>
    </div>
</div>
