<!-- /templates/library.html -->
<div class="container mx-auto p-4 h-full flex flex-col">
    <!-- Modale de statut -->
    <div id="library-status-overlay"
        class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-20 hidden">
        <div class="p-6 bg-white rounded-xl shadow-lg font-medium flex flex-col items-center">
            <div class="w-10 h-10 border-4 border-dashed rounded-full loader mb-4"></div>
            <span id="library-status-text">Traitement en cours...</span>
        </div>
    </div>

    <div class="flex justify-between items-center flex-shrink-0 border-b-4 border-gray-700 mb-3">
        <h1 class="text-4xl font-bold text-gray-800">Bibliothèque Lutrin</h1>
    </div>

    <div class="flex space-x-1 mb-3">
        <button id="admin-add-epub-button"
            class="bg-red-600 text-white font-bold py-2 px-4 rounded-lg hover:bg-red-700 transition-colors flex items-center shadow-sm hover:shadow-md hidden"
            data-admin-only="true">
            <i class="fas fa-upload fa-2x"></i>
            <span class="hidden sm:inline ml-2">Ajouter un livre</span>
        </button>
    </div>

    <input type="file" id="admin-epub-file-input" class="hidden" accept=".epub">

    <!-- Barre de filtres -->
    <div id="filters-bar"
        class="bg-white p-3 rounded-xl shadow-lg mb-8 flex-shrink-0 flex flex-wrap items-center gap-4">
        <!-- Filtre par titre -->
        <div class="flex-grow min-w-[200px]">
            <label for="title-filter" class="block text-sm font-medium text-gray-700">Rechercher par titre</label>
            <input type="text" id="title-filter" placeholder="Titre du livre..."
                class="mt-1 block w-full pl-3 pr-4 py-2 text-base border-gray-300 sm:text-sm rounded-md">
        </div>
        <!-- Filtre par style -->
        <div class="flex-grow min-w-[150px]">
            <label for="style-filter" class="block text-sm font-medium text-gray-700">Genre</label>
            <select id="style-filter"
                class="mt-1 block w-full pl-3 pr-10 py-2 text-base border-gray-300 sm:text-sm rounded-md"></select>
        </div>
        <!-- Filtre par série -->
        <div class="flex-grow min-w-[150px]">
            <label for="series-filter" class="block text-sm font-medium text-gray-700">Série</label>
            <select id="series-filter"
                class="mt-1 block w-full pl-3 pr-10 py-2 text-base border-gray-300 sm:text-sm rounded-md"></select>
        </div>
        <!-- Filtre par auteur -->
        <div class="flex-grow min-w-[150px]">
            <label for="author-filter" class="block text-sm font-medium text-gray-700">Auteur</label>
            <select id="author-filter"
                class="mt-1 block w-full pl-3 pr-10 py-2 text-base border-gray-300 sm:text-sm rounded-md"></select>
        </div>
        <!-- Toggle pour masquer les déjà téléchargés -->
        <div class="flex items-center pt-6">
            <label for="hide-downloaded-toggle" class="flex items-center cursor-pointer">
                <div class="relative">
                    <input type="checkbox" id="hide-downloaded-toggle" class="sr-only peer">
                    <div class="block bg-gray-200 w-14 h-8 rounded-full peer-checked:bg-blue-600 transition-colors">
                    </div>
                    <div
                        class="dot absolute left-1 top-1 bg-white w-6 h-6 rounded-full transition-transform peer-checked:translate-x-full">
                    </div>
                </div>
                <div class="ml-3 text-gray-700 font-medium">Masquer les déjà téléchargés</div>
            </label>
        </div>
    </div>

    <div id="library-list-container" class="flex-grow overflow-y-auto pb-6">
        <div id="library-list" class="space-y-4"></div>

        <div id="library-placeholder"
            class="hidden text-gray-500 m-auto text-center h-full flex flex-col justify-center items-center">
            <i class="fas fa-book-dead fa-4x mb-4"></i>
            <p>La bibliothèque centrale est vide ou inaccessible.</p>
        </div>
    </div>
</div>

<!-- Modale d'édition pour la bibliothèque centrale (Admin) -->
<div id="library-edit-overlay"
    class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden">
    <div class="bg-white p-6 rounded-lg shadow-xl w-full max-w-2xl">
        <h3 class="text-lg font-medium leading-6 text-gray-900 mb-4">Modifier le livre</h3>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Colonne de gauche : Couverture -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Couverture</label>
                <div id="edit-cover-preview-wrapper" class="relative group cursor-pointer">
                    <img id="edit-cover-preview" src="" alt="Aperçu de la couverture"
                        class="w-full h-auto object-cover rounded-md shadow-md">
                    <div
                        class="absolute inset-0 bg-black bg-opacity-50 flex items-center justify-center text-white text-center p-4 opacity-0 group-hover:opacity-100 transition-opacity rounded-md">
                        <span>Cliquer pour changer la couverture</span>
                    </div>
                </div>
                <input type="file" id="edit-cover-input" class="hidden" accept="image/png, image/jpeg, image/webp">
            </div>
            <!-- Colonne de droite : Champs de texte -->
            <div class="space-y-4">
                <div>
                    <label for="edit-authors-input" class="block text-sm font-medium text-gray-700">Auteurs (séparés par
                        une virgule)</label>
                    <input type="text" id="edit-authors-input"
                        class="mt-1 block w-full shadow-sm text-base border-gray-300 rounded-md py-2 px-3">
                </div>
                <div>
                    <label for="edit-style-input" class="block text-sm font-medium text-gray-700">Genre</label>
                    <input type="text" id="edit-style-input"
                        class="mt-1 block w-full shadow-sm text-base border-gray-300 rounded-md py-2 px-3">
                </div>
                <div>
                    <label for="edit-series-name-input" class="block text-sm font-medium text-gray-700">Série</label>
                    <input type="text" id="edit-series-name-input"
                        class="mt-1 block w-full shadow-sm text-base border-gray-300 rounded-md py-2 px-3">
                </div>
                <div>
                    <label for="edit-series-number-input" class="block text-sm font-medium text-gray-700">Numéro de
                        série</label>
                    <input type="number" id="edit-series-number-input"
                        class="mt-1 block w-full shadow-sm text-base border-gray-300 rounded-md py-2 px-3">
                </div>
                <div>
                    <label for="edit-description-input"
                        class="block text-sm font-medium text-gray-700">Description</label>
                    <textarea id="edit-description-input" rows="4"
                        class="mt-1 block w-full shadow-sm text-base border-gray-300 rounded-md py-2 px-3"></textarea>
                </div>
            </div>
        </div>
        <div class="mt-6 flex justify-end space-x-3">
            <button type="button" id="cancel-library-edit"
                class="bg-white py-2 px-4 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 hover:bg-gray-50">Annuler</button>
            <button type="button" id="save-library-edit"
                class="bg-blue-600 py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white hover:bg-blue-700">Sauvegarder</button>
        </div>
    </div>
</div>
