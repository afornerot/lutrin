<!-- /templates/epubs.html -->
<div class="page-content">
    <!-- Modale de statut d'upload -->
    <div id="epub-upload-status-overlay" class="modal-overlay hidden">
        <div class="card modal-loading">
            <div class="loader"></div>
            <span id="epub-upload-status-text">Traitement en cours...</span>
        </div>
    </div>

    <h1>Ma Bibliothèque</h1>

    <div class="action-bar">
        <button id="add-epub-button" class="btn-primary">
            <i class="fas fa-plus"></i>
            <span>Ajouter un Livre</span>
        </button>

        <a href="/library" class="btn-secondary">
            <i class="fas fa-server"></i>
            <span>Ajouter depuis Lutrin</span>
        </a>
    </div>

    <!-- Input de fichier caché -->
    <input type="file" id="epub-file-input" class="hidden" accept=".epub">

    <!-- Barre de filtres -->
    <div id="filters-bar" class="card filters-bar">
        <div class="form-group">
            <label for="style-filter">Genre</label>
            <select id="style-filter"></select>
        </div>

        <div class="form-group">
            <label for="series-filter">Série</label>
            <select id="series-filter"></select>
        </div>

        <div class="form-group">
            <label for="author-filter">Auteur</label>
            <select id="author-filter"></select>
        </div>

        <div class="toggle-group">
            <label class="checkbox-label">
                <input type="checkbox" id="hide-finished-toggle">
                Masquer les lus
            </label>
        </div>
    </div>

    <div id="epub-list-container">
        <!-- Section En cours -->
        <div id="in-progress-section" class="card section-block">
            <h2>En Cours</h2>
            <div id="in-progress-grid" class="book-grid"></div>
            <p id="in-progress-placeholder" class="hidden">Aucun livre en cours de lecture.</p>
        </div>

        <!-- Section Non lus -->
        <div id="not-started-section" class="card section-block">
            <h2>Non lus</h2>
            <div id="not-started-grid" class="book-grid"></div>
            <p id="not-started-placeholder" class="hidden">Aucun livre non lu.</p>
        </div>

        <!-- Section Lus -->
        <div id="finished-section" class="card section-block">
            <h2>Lus</h2>
            <div id="finished-grid" class="book-grid"></div>
            <p id="finished-placeholder" class="hidden">Aucun livre terminé.</p>
        </div>

        <div id="epub-placeholder" class="hidden placeholder">
            <i class="fas fa-book-dead"></i>
            <p>Votre bibliothèque est vide. Cliquez sur "Ajouter" pour commencer.</p>
        </div>
    </div>
</div>
