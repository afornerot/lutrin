version: '3'

tasks:
  default:
    cmds:
      - task: --list

  build:
    desc: Build images, download models, initialize database
    cmds:
      - mkdir -p lutrin_data/api lutrin_data/coqui
      - task: download-models
      - docker compose build
      - ./lutrin_tools/task_scripts/init-db.sh
      - ./lutrin_tools/task_scripts/check-users.sh

  download-models:
    desc: Download Piper & Coqui TTS models
    cmds:
      - ./lutrin_tools/task_scripts/download-piper.sh
      - ./lutrin_tools/task_scripts/download-coqui.sh

  pull:
    desc: Stop, pull latest changes, start
    cmds:
      - task: stop
      - git pull
      - task: start

  start:
    desc: Start all services
    cmds:
      - docker compose up -d
      - |
        echo "Services started. Access:"
        echo "  - Client: https://localhost:8000"
        echo "  - API: http://localhost:5000"
        echo "  - Coqui TTS: http://localhost:5002"

  stop:
    desc: Stop all services
    cmds:
      - docker compose down
      #- docker rm -f lutrin_api_dev 2>/dev/null || true

  restart:
    desc: Restart all services
    deps: [stop]
    cmds:
      - task: start

#  dev:
#    desc: Start API in dev mode (with hot reload)
#    deps: [stop]
#    cmds:
#      - docker compose up -d --no-deps coqui client
#      - docker compose run -d --rm --name lutrin_api_dev --service-ports api sh -c "export LUTRIN_MODE=dev && cd /app && python app.py"

  status:
    desc: Show service status
    cmds:
      - docker compose ps

  logs:
    desc: "Follow logs (e.g. task logs, task logs service=api)"
    cmds:
      - |
        if [ -n "{{.service}}" ]; then
          docker compose logs -f --tail=50 {{.service}}
        else
          docker compose logs -f --tail=50
        fi

  clean:
    desc: Remove containers, networks, built images (keeps data)
    cmds:
      - |
        echo "This will stop and remove containers, networks, and built images."
        echo "Data in ./lutrin_data/ will be kept."
        read -p "Are you sure? (y/N) " confirm
        if [[ "$confirm" =~ ^[yY]$ ]]; then
          docker compose down
          docker rmi lutrin_api lutrin_client 2>/dev/null || true
          echo "Cleanup complete."
        else
          echo "Operation cancelled."
        fi

  add-user:
    desc: Add a new user
    cmds:
      - ./lutrin_tools/task_scripts/add-user.sh {{.user}} {{.password}} {{.email}} {{.role}}

  change-password:
    desc: Change a user's password
    cmds:
      - ./lutrin_tools/task_scripts/change-password.sh {{.user}} {{.password}}
